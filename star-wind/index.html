<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベイビーラン｜星風の森</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#f8f5dc;background:#173738}
body{margin:0;overflow:hidden;overscroll-behavior:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
[hidden]{display:none!important}
.hud{position:fixed;inset:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) auto max(10px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.readout{font-weight:800;font-variant-numeric:tabular-nums;text-align:center;background:#173332ed;border:1px solid #d9f2b855;border-radius:12px;padding:5px 10px;min-width:46px}
.readout small{display:block;font-size:10px;color:#d2e8b2}.score{font-size:clamp(18px,4vw,29px)}
button{font:inherit;font-weight:800;border:0;border-radius:13px;padding:10px 16px;min-height:44px;background:#e8f0c1;color:#15332e;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.48}.hud button{pointer-events:auto;padding:8px 12px}
#meters{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 9px);left:50%;transform:translateX(-50%);background:#173332ee;border-radius:20px;padding:5px 12px;display:flex;gap:8px;align-items:center;white-space:nowrap;font-size:12px}
progress{accent-color:#ffd574;width:clamp(80px,29vw,180px)}
#panel{position:fixed;inset:0;display:grid;place-items:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:#17373768}
article{width:min(95%,384px);max-height:100%;overflow:auto;padding:clamp(15px,4vw,28px);border-radius:27px;background:#102f2deF;border:1px solid #afe5b47d;box-shadow:0 22px 80px #0a252c80;text-align:center}
h1{font-size:clamp(23px,5vw,38px);margin:4px 0 8px;color:#fff3ba}p{margin:7px 0 15px;line-height:1.45}small{color:#cfebcc}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.primary{background:#ffd575}.secondary{background:#35605a;color:white}
</style>
</head>
<body>
<canvas id="scene" aria-label="走行コース"></canvas>
<div id="hud" class="hud" hidden>
 <div class="readout"><small>BEST</small><span id="best"></span></div>
 <div class="readout score" id="score">0</div>
 <div class="readout"><small>星</small><span id="stars">0</span></div>
 <button id="pause" aria-label="一時停止">Ⅱ</button>
</div>
<div id="meters" hidden><span id="meterText">フィーバー</span><progress id="meter" max="18" value="0" aria-label="フィーバーゲージ"></progress><span id="power"></span></div>
<div id="panel"><article id="card"></article></div>
<script>
"use strict";
const TRACK=620, GRAVITY=1360, FIRST=-465, SECOND=-410, FEVER_COUNT=18;
const clamp=(n,lo,hi)=>Math.min(hi,Math.max(lo,n));
const lerp=(a,b,t)=>a+(b-a)*t;
const balance={speed:275,topSpeed:432,bikeSpeed:1.38,itemDelay:5.8};
const skyNames=["朝露の森","木漏れ日の谷","夕映えの森"];
const itemInfo={
 stars:{name:"星＋5",mark:"+5",color:"#ffdd86",time:0},
 magnet:{name:"磁石",mark:"U",color:"#ff9c92",time:5},
 shield:{name:"シールド",mark:"◇",color:"#9cecf6",time:3},
 bike:{name:"自転車",mark:"»",color:"#d4b0ff",time:5}
};
const pattern=[
 "intro","gap","ridge","stomp","high","drop","gap","mix","ridge","stomp","high","drop"
];
function courseKind(i){
 if(i<pattern.length)return pattern[i];
 const rotation=["mix","gap","drop","stomp","high","ridge","gap"];
 return rotation[(i*5+Math.floor(i/7))%rotation.length];
}
function buildChunk(i){
 const start=i*TRACK,kind=courseKind(i);
 const c={start,kind,ground:[],hazards:[],stars:[]};
 const surface=(a,b,ya,yb=ya)=>c.ground.push({a:start+a,b:start+b,ya,yb});
 const hazard=(x,w,h,type)=>c.hazards.push({x:start+x,w,h,type});
 const row=(x,y,n,dx,dy=0)=>{for(let j=0;j<n;j++)c.stars.push({x:start+x+j*dx,y:y+j*dy});};
 const arc=(from,to,height,baseline=275)=>{for(let j=0;j<7;j++){const p=j/6;c.stars.push({x:start+lerp(from,to,p),y:baseline-Math.sin(p*Math.PI)*height});}};
 switch(kind){
 case "intro":
  surface(0,TRACK,300);row(170,276,5,26);hazard(442,32,30,"crate");arc(380,510,56);break;
 case "gap":
  surface(0,271,300);surface(386,TRACK,300);arc(242,425,67);row(470,275,4,24);break;
 case "ridge":
  surface(0,115,300);surface(115,265,300,226);surface(265,410,226);surface(410,555,226,300);surface(555,TRACK,300);
  row(140,265,5,25,-12);row(278,201,5,25);break;
 case "stomp":
  surface(0,TRACK,300);hazard(294,38,23,"mushroom");arc(236,383,48);
  row(450,276,4,25);break;
 case "high":
  surface(0,TRACK,300);hazard(310,30,46,"crate");arc(250,403,58);row(317,153,5,23,-2);break;
 case "drop":
  surface(0,95,300);surface(95,242,300,222);surface(242,350,222);surface(350,TRACK,300);
  row(245,198,4,23);row(372,204,5,18,15);row(480,275,4,25);break;
 default:
  surface(0,408,300);surface(520,TRACK,300);hazard(145,30,30,"crate");
  arc(95,214,51);arc(376,552,65);
 }
 return c;
}
const bubbleY=(item,t)=>item.y+Math.sin(t*5+item.x*.02)*6;
class Run {
 constructor(level=0){
  this.x=92;this.y=300;this.vy=0;this.time=0;this.grounded=true;
  this.jumps=0;this.air=0;this.buffer=0;this.spin=0;
  this.score=0;this.stars=0;this.charge=0;this.fever=0;this.effects=null;
  this.shield=0;this.gapGrace=false;this.level=level;this.dead=false;this.chunks=new Map();
  this.items=[];this.nextItem=4.6;this.itemIndex=0;this.bursts=[];
 }
 chunk(i){if(i<0)return null;if(!this.chunks.has(i))this.chunks.set(i,buildChunk(i));return this.chunks.get(i);}
 floor(x){
  if(x<0)return 300;
  const s=this.chunk(Math.floor(x/TRACK)).ground.find(p=>x>=p.a&&x<p.b);
  return s?lerp(s.ya,s.yb,(x-s.a)/(s.b-s.a)):Infinity;
 }
 jump(){
  if(this.dead)return false;
  if(this.grounded||(!this.jumps&&this.air<.085)){this.vy=FIRST;this.jumps=1;}
  else if(this.jumps<2){this.vy=SECOND;this.jumps=2;this.spin=.45;}
  else{this.buffer=.09;return false;}
  this.grounded=false;this.air=.09;return true;
 }
 value(n){
  this.stars+=n;this.score+=n*(this.fever?30:15);
  if(this.fever)return;
  this.charge+=n;
  if(this.charge>=FEVER_COUNT){this.charge-=FEVER_COUNT;this.fever=6;}
 }
 take(kind,now){
  if(kind==="stars"){this.value(5);return;}
  this.effects={kind,end:now+itemInfo[kind].time};
 }
 get speed(){return Math.min(balance.topSpeed,balance.speed+this.time*1.65)*(this.effects?.kind==="bike"?balance.bikeSpeed:1);}
 get result(){return Math.floor(this.score*(1+this.level*.07));}
 step(dt,now,active=this.time+dt){
  if(this.dead)return;
  this.time+=dt;
  const oldFever=this.fever, oldEffect=this.effects;
  this.fever=Math.max(0,this.fever-dt);this.spin=Math.max(0,this.spin-dt);
  this.shield=Math.max(0,this.shield-dt);this.buffer=Math.max(0,this.buffer-dt);
  if(this.effects&&now>=this.effects.end)this.effects=null;
  const covered=()=>this.fever>0||this.effects?.kind==="bike";
  if((oldFever||oldEffect?.kind==="bike")&&!covered()&&!Number.isFinite(this.floor(this.x))){
   // Finish crossing the gap without extending the score or speed bonus.
   this.gapGrace=true;
  }
  const previousX=this.x, previousY=this.y, oldFloor=this.floor(this.x);
  this.x+=this.speed*dt;this.score+=this.speed*dt*.105;
  let ground=this.floor(this.x);
  if(Number.isFinite(ground))this.gapGrace=false;
  else if(covered()||this.gapGrace)ground=300;
  const stable=this.grounded&&Number.isFinite(ground)&&
   (ground-oldFloor<3||!Number.isFinite(oldFloor)&&Math.abs(this.y-ground)<3);
  if(stable){this.y=ground;this.vy=0;}
  else{
   this.grounded=false;this.air+=dt;
   this.vy+=GRAVITY*dt;this.y+=this.vy*dt;
   if(previousY<=ground+3&&this.y>=ground&&this.vy>=0){
    this.y=ground;this.vy=0;this.jumps=0;this.air=0;this.grounded=true;
    if(this.buffer>0){this.buffer=0;this.jump();}
   }
  }
  if(this.y>450){this.dead=true;return;}
  const index=Math.floor(this.x/TRACK);
  for(let i=Math.max(0,index-1);i<=index+1;i++){
   const c=this.chunk(i);
   for(const h of c.hazards){
    if(h.gone||this.x+12<h.x||previousX-11>h.x+h.w)continue;
    const top=300-h.h;
    if(this.y<top||this.y-39>300)continue;
    if(h.type==="mushroom"&&previousY<=top+4&&this.vy>0){
     this.y=top;this.vy=-355;this.jumps=0;this.air=.09;this.value(3);h.gone=true;
    }else if(this.fever||this.shield||this.effects?.kind==="shield"||this.effects?.kind==="bike"){
     h.gone=true;
    }else{this.dead=true;return;}
   }
   for(const star of c.stars){
    if(star.got)continue;
    const radius=this.fever?86:this.effects?.kind==="magnet"?98:24;
    if(Math.hypot(star.x-this.x,star.y-(this.y-20))<=radius){
     star.got=true;this.value(1);this.bursts.push({x:star.x,y:star.y,until:this.time+.3});
    }
   }
  }
  this.bursts=this.bursts.filter(p=>p.until>this.time);
  if(active>=this.nextItem){
   const item=this.findItemSpace();
   if(item){
    this.items.push(item);
    this.nextItem=active+balance.itemDelay;
   }else this.nextItem=active+.25;
  }
  for(const item of this.items){
   if(item.got||this.grounded||this.effects||Math.hypot(item.x-this.x,bubbleY(item,this.time)-(this.y-20))>25)continue;
   item.got=true;this.take(item.kind,now);
  }
  this.items=this.items.filter(item=>!item.got&&item.x>this.x-65);
  for(const key of this.chunks.keys())if(key<index-2)this.chunks.delete(key);
 }
 findItemSpace(){
  for(let offset=225;offset<=520;offset+=30){
   const x=this.x+offset,base=this.floor(x),index=Math.floor(x/TRACK);
   const nearby=[this.chunk(index-1),this.chunk(index),this.chunk(index+1)].filter(Boolean);
   if(!Number.isFinite(base)||Math.abs(this.floor(x-55)-base)>18||Math.abs(this.floor(x+45)-base)>18||
    nearby.some(c=>c.hazards.some(h=>Math.abs(h.x-x)<91)))continue;
   return {x,y:base-80,kind:["stars","magnet","shield","bike"][this.itemIndex++%4]};
  }
  return null;
 }
}
const byId=id=>document.getElementById(id);
const canvas=byId("scene"),g=canvas.getContext("2d");
const STORAGE="babyRun.starWind.1";
let record={best:0,bank:0,level:0};
try{
 const data=JSON.parse(localStorage.getItem(STORAGE));
 for(const key of Object.keys(record))if(Number.isSafeInteger(data?.[key])&&data[key]>=0)record[key]=data[key];
}catch{}
let storageWorks=true;
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(record));}catch{storageWorks=false;}}

let W,H,scale,offset=0,run=new Run(),state="menu",last=0,banked=0,revived=false;
let playStart=0,activeBefore=0,accumulator=0,nextHud=0;
function resize(){
 const bounds=canvas.getBoundingClientRect(),ratio=Math.min(devicePixelRatio||1,2);
 scale=Math.min(bounds.width/386,bounds.height/360);
 W=bounds.width/scale;H=bounds.height/scale;
 canvas.width=Math.round(bounds.width*ratio);canvas.height=Math.round(bounds.height*ratio);
 g.setTransform(scale*ratio,0,0,scale*ratio,0,0);
 offset=(H-360)*.67;
}
addEventListener("resize",resize);
function card(html){
 byId("card").innerHTML=html;byId("panel").hidden=false;
}
function bind(id,fn){byId(id).onclick=fn;}
function menu(){
 state="menu";byId("hud").hidden=byId("meters").hidden=true;
 const cost=(record.level+1)*12;
 card(`<small>ベイビーラン</small><h1>星風の森</h1><p>タップでジャンプ。空中でタップすると前転。</p>
   <p>BEST <strong>${record.best}</strong>　星 <strong>${record.bank}</strong>　Lv.${1+record.level}</p>
   <nav><button class="primary" id="start">走る</button><button class="secondary" id="grow" ${record.bank<cost?"disabled":""}>育成・星${cost}</button></nav>
   <p><small>育成で得点倍率アップ ×${(1+record.level*.07).toFixed(2)}${storageWorks?"":" ・保存不可"}</small></p>`);
 bind("start",start);
 bind("grow",()=>{if(record.bank<cost)return;record.bank-=cost;record.level++;persist();menu();});
}
function begin(){
 state="playing";playStart=performance.now()/1000;nextHud=0;
 byId("panel").hidden=true;byId("hud").hidden=byId("meters").hidden=false;updateHud();
}
function start(){run=new Run(record.level);banked=activeBefore=accumulator=0;revived=false;begin();}
function pause(){
 if(state!=="playing")return;
 activeBefore+=performance.now()/1000-playStart;state="paused";accumulator=0;
 card('<h1>一時停止</h1><nav><button id="resume">続ける</button><button class="secondary" id="finish">結果を見る</button></nav>');
 bind("resume",begin);bind("finish",finish);
}
function finish(){
 state="over";record.bank+=run.stars-banked;banked=run.stars;
 record.best=Math.max(record.best,run.result);persist();updateHud();
 card(`<small>${Math.floor((run.x-92)/10)} m</small><h1>${run.result.toLocaleString()} 点</h1><p>星 ${run.stars}　BEST ${record.best}</p>
 <nav><button class="primary" id="again">もう一度</button>
 ${run.dead&&!revived?'<button class="secondary" id="revive">試験用復活</button>':''}
 <button class="secondary" id="home">ホーム</button></nav>`);
 bind("again",start);bind("home",menu);
 if(run.dead&&!revived)bind("revive",()=>{
  revived=true;run.dead=false;
  while(!Number.isFinite(run.floor(run.x)))run.x+=8;
  run.y=run.floor(run.x);run.shield=1.35;run.vy=run.jumps=run.air=run.buffer=run.spin=0;
  run.grounded=true;accumulator=0;begin();
 });
}
function updateHud(){
 byId("best").textContent=record.best.toLocaleString();
 byId("score").textContent=run.result.toLocaleString();byId("stars").textContent=run.stars;
 byId("meterText").textContent=run.fever?"FEVER ×2":"フィーバー";
 byId("meter").max=run.fever?6:FEVER_COUNT;byId("meter").value=run.fever||run.charge;
 const duration=run.effects?Math.ceil(run.effects.end-Date.now()/1000):0;
 byId("power").textContent=duration>0?itemInfo[run.effects.kind].name+" "+duration+"秒":skyNames[Math.floor(run.x/(TRACK*9))%3];
}
bind("pause",pause);
document.addEventListener("visibilitychange",()=>{if(document.hidden)pause();});
canvas.addEventListener("pointerdown",e=>{
 if(state!=="playing"||!e.isPrimary||e.button!==0)return;
 e.preventDefault();run.jump();
});
addEventListener("keydown",e=>{
 if(e.repeat||e.target instanceof HTMLButtonElement)return;
 if(state==="playing"&&(e.code==="Space"||e.code==="ArrowUp")){e.preventDefault();run.jump();}
 if(e.code==="Escape"&&state==="playing")pause();
});
function fillRect(x,y,w,h,paint){g.fillStyle=paint;g.fillRect(x,y,w,h);}
function ellipse(x,y,rx,ry,paint){
 g.fillStyle=paint;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill();
}
function path(points,paint){
 g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fillStyle=paint;g.fill();
}
function line(points,paint,width){
 g.beginPath();points.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.strokeStyle=paint;g.lineWidth=width;g.lineCap="round";g.stroke();
}
function glyph(text,x,y,color,size){
 g.fillStyle=color;g.font="800 "+size+"px system-ui";g.textAlign="center";g.textBaseline="middle";g.fillText(text,x,y);
}
function star(x,y,r,paint){
 const points=Array.from({length:10},(_,i)=>{
  const a=i*Math.PI/5-Math.PI/2,b=i%2?r*.48:r;
  return [x+Math.cos(a)*b,y+Math.sin(a)*b];
 });path(points,paint);
}
function scenery(camera,dy){
 const palette=[
  ["#6fc8c0","#f4edb5","#9accaa","#5a9d83","#306a60"],
  ["#83c5da","#d3efdd","#96c9c2","#558f89","#315f64"],
  ["#ba88ab","#ffd3a2","#b6a3a2","#80798e","#4b5c68"]
 ][Math.floor(run.x/(TRACK*9))%3];
 const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,palette[0]);sky.addColorStop(1,palette[1]);
 fillRect(0,0,W,H,sky);ellipse(W*.77,H*.24,37,37,"#fff2b8b0");
 for(let layer=0;layer<3;layer++){
  const width=layer===2?87:174,scroll=camera*(.18+layer*.14),first=Math.floor(scroll/width)-1;
  for(let i=first;i<first+Math.ceil(W/width)+3;i++){
   const x=i*width-scroll,h=34+Math.sin(i*13.17)*20,y=304+dy-layer*4;
   if(layer===2){
    fillRect(x-5,y-h-37,10,h+40,palette[4]);
    ellipse(x,y-h-65,31,47,palette[4]);ellipse(x-9,y-h-78,21,28,palette[3]);
   }else{
    path([[x,y+24],[x+width*.17,y-31-h],[x+width*.44,y-63-h],[x+width*.75,y-27-h],[x+width,y+24]],palette[layer+2]);
   }
  }
 }
}
function terrain(p,camera,dy){
 const x=p.a-camera,b=p.b-camera,y=p.ya+dy,z=p.yb+dy;
 path([[x,y],[b,z],[b,H],[x,H]],"#534638");
 path([[x,y],[b,z],[b,z+8],[x,y+8]],"#9ed18b");
 path([[x,y+8],[b,z+8],[b,z+14],[x,y+14]],"#548b68");
 for(let wx=Math.ceil(p.a/42)*42;wx<p.b-8;wx+=42){
  const py=lerp(y,z,(wx-p.a)/(p.b-p.a));
  ellipse(wx-camera,py+25,6,2,"#9d7954");ellipse(wx-camera+12,py+38,3,2,"#796049");
 }
}
function drawChild(x,y,t){
 const stride=run.grounded?Math.sin(run.x*.086):.42;
 const bob=run.grounded?(1-Math.cos(run.x*.172))*1.2:0;
 g.save();g.translate(x,y-20-bob);
 if(run.spin>0)g.rotate((1-run.spin/.45)*Math.PI*2);
 else g.rotate(stride*.085);
 for(const sign of [-1,1]){
  const sx=sign*stride*9;
  line([[sign*5,8],[sx,19]],"#df9e70",7);ellipse(sx+3,19,7,3.6,"#fff1bd");
 }
 line([[-8,-4],[-12-stride*10,4]],"#d89267",5);
 ellipse(0,2,13,12,"#f9b44d");ellipse(3,5,7,5,"#ffe292");
 line([[7,-4],[13+stride*11,4]],"#ffd2a5",5);
 drawFace();g.restore();
 if(run.effects?.kind==="bike"){
  ellipse(x-13,y-2,8,8,"#284f54");ellipse(x+15,y-2,8,8,"#284f54");line([[x-12,y-2],[x+11,y-11],[x+16,y-2]],"#cb9df5",3);
 }
 if(run.shield||run.fever||run.effects?.kind==="shield"){
  g.strokeStyle=run.fever?"#ffe5a2":"#b9f3ff";g.lineWidth=2;g.beginPath();g.arc(x,y-20,28+Math.sin(t*9),0,Math.PI*2);g.stroke();
 }
}
function drawFace(){
 ellipse(2,-15,13,13,"#76443d");ellipse(4,-12,11,10,"#ffcfaa");
 ellipse(0,-20,9,5,"#76443d");ellipse(10,-13,1.4,2,"#593e38");
 ellipse(10,-8,2.8,1.4,"#f5937c");line([[7,-8],[9,-7]],"#974e46",1);
}
function render(t){
 const anchor=Math.min(W*.27,145),camera=run.x-anchor;
 const dy=offset;
 scenery(camera,dy);
 if(camera<0)terrain({a:camera,b:0,ya:300,yb:300},camera,dy);
 for(let idx=Math.max(0,Math.floor(camera/TRACK));idx<=Math.floor((camera+W)/TRACK);idx++){
  const c=run.chunk(idx);
  for(const p of c.ground)terrain(p,camera,dy);
  for(const h of c.hazards){
   if(h.gone)continue;
   const x=h.x-camera,y=300+dy;
   if(h.type==="mushroom"){
    ellipse(x+h.w*.5,y-8,h.w*.25,8,"#ffe4b6");ellipse(x+h.w*.5,y-18,h.w*.5,9,"#ec786b");
    ellipse(x+10,y-20,4,3,"#ffedc7");ellipse(x+26,y-18,3,2,"#ffedc7");
   }else{
    fillRect(x,y-h.h,h.w,h.h,"#ac6b4d");fillRect(x+3,y-h.h+3,h.w-6,h.h-6,"#d59a62");
    line([[x+6,y-6],[x+h.w-6,y-h.h+6]],"#915c46",3);
   }
  }
  for(const s of c.stars)if(!s.got){star(s.x-camera,s.y+dy,8,"#fff3bf");star(s.x-camera,s.y+dy,5.8,"#ffcb68");}
 }
 for(const b of run.items){
  const item=itemInfo[b.kind],x=b.x-camera,y=bubbleY(b,run.time)+dy;
  ellipse(x,y,17,17,"#e2fbce55");g.strokeStyle=item.color;g.lineWidth=2;g.stroke();ellipse(x-6,y-8,4,2,"#ffffffbb");
  glyph(item.mark,x,y,item.color,14);
 }
 for(const p of run.bursts)star(p.x-camera,p.y+dy-12,9,"#fffdf1");
 if(run.fever){
  fillRect(0,0,W,5,"#ffe48f");glyph("FEVER",W*.5,86,"#fff6b8",26);
 }
 drawChild(anchor,run.y+dy,t);
}
function frame(ms){
 const dt=last?Math.min(.05,(ms-last)/1000):0;last=ms;
 if(state==="playing"){
  const now=Date.now()/1000,active=activeBefore+ms/1000-playStart;
  accumulator+=dt;
  while(accumulator>=1/120&&!run.dead){
   run.step(1/120,now,active);accumulator-=1/120;
  }
  if(run.dead)finish();
  else if(ms>=nextHud){updateHud();nextHud=ms+60;}
 }
 render(ms/1000);requestAnimationFrame(frame);
}
resize();menu();requestAnimationFrame(frame);
</script>
