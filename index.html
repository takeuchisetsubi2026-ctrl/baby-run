<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ベイビーラン 試作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10283d;font-family:system-ui,sans-serif;color:white;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:5px;width:100%;display:none;align-items:center;justify-content:space-between;padding:0 14px;pointer-events:none;font-weight:900;text-shadow:1px 2px #123}#score{font-size:clamp(20px,4vw,34px)}#banner{position:fixed;bottom:0;height:40px;background:#273d4d;width:100%;display:grid;place-items:center;font-size:12px;color:#b8cad2}#overlay{position:fixed;inset:0 0 40px;background:#10283dcf;display:grid;place-items:center}#panel{background:#fff;color:#17304b;border-radius:20px;padding:20px;min-width:min(330px,88vw);max-height:90%;overflow:auto;text-align:center}button{border:0;border-radius:12px;padding:12px 18px;background:#47c7e9;color:#123;font-size:16px;font-weight:800;margin:4px}button.gold{background:#ffc948}button.gray{background:#dbe4e9}#count{position:fixed;inset:0 0 40px;display:none;place-items:center;font-size:90px;font-weight:900;pointer-events:none}#bar{height:15px;border-radius:10px;background:#dbe4e9;overflow:hidden}#fill{height:100%;background:#ffc948}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>👶</span><span id="score">0</span><span id="coins">🪙 0</span></div><div id="banner">広告予定エリア（試作版は広告未接続）</div><div id="count"></div><div id="overlay"><div id="panel"></div></div>
<script>
(()=>{
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),hud=document.getElementById("hud"),overlay=document.getElementById("overlay"),panel=document.getElementById("panel"),count=document.getElementById("count");
let W=0,H=0,ground=0,playerX=0,y=0,vy=0,jumps=0,state="home",last=0,elapsed=0,distance=0,runCoins=0,objects=[],coinItems=[],spawn=0,coinSpawn=0,boost=0,nextBoost=50,invuln=0,revived=false,retries=0;
let bank=Number(localStorage.getItem("baby_bank")||0),up=Number(localStorage.getItem("baby_up")||0),best=Number(localStorage.getItem("baby_best")||0);
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);ground=H-40-Math.max(38,H*.16);playerX=W*.30;if(state!=="play")y=ground-38}addEventListener("resize",resize);resize();
const score=()=>Math.floor(distance*5*(1+up*.01)+runCoins*10);
const cost=()=>Math.round(10*Math.pow(1.18,up)/5)*5;
function view(s){overlay.style.display="grid";panel.innerHTML=s}
function home(){state="home";hud.style.display="none";view('<h1>👶 ベイビーラン</h1><p>ベスト '+best.toLocaleString()+' 点</p><p>🪙 '+bank+' コイン</p><button id="start">スタート</button><p><button id="grow" class="gray">育成</button><button id="settings" class="gray">設定</button></p><small>横向き推奨。タップでジャンプ、もう一度タップで二段ジャンプ</small>');document.getElementById("start").onclick=()=>start(false);document.getElementById("grow").onclick=grow;document.getElementById("settings").onclick=()=>{view('<h2>設定</h2><p>操作：タップで二段ジャンプ</p><p>音・振動は今後実装</p><button id="back">戻る</button>');document.getElementById("back").onclick=home}}
function grow(){state="grow";view('<h2>育成 Lv.'+(1+Math.floor(up/10))+'</h2><p>🪙 '+bank+' コイン</p><div id="bar"><div id="fill" style="width:"+(up%10*10)+'%"></div></div><p>次の強化：'+cost()+' コイン</p><button id="upgrade" class="gold">強化する</button><button id="back" class="gray">戻る</button>');document.getElementById("upgrade").onclick=()=>{if(bank>=cost()){bank-=cost();up++;localStorage.setItem("baby_bank",bank);localStorage.setItem("baby_up",up);grow()}};document.getElementById("back").onclick=home}
function start(resume){if(!resume){elapsed=0;distance=0;runCoins=0;objects=[];coinItems=[];spawn=70;coinSpawn=70;boost=0;nextBoost=50;revived=false}y=ground-38;vy=0;jumps=0;invuln=resume?2:0;state="play";hud.style.display="flex";overlay.style.display="none";last=performance.now();requestAnimationFrame(frame)}
function end(){state="over";bank+=runCoins;localStorage.setItem("baby_bank",bank);const s=score(),record=s>best;if(record){best=s;localStorage.setItem("baby_best",best)}view('<h1>GAME OVER</h1>'+(record?'<h3 style="color:#d9a300">✨ NEW RECORD!</h3>':'')+'<p>スコア '+s.toLocaleString()+'</p><p>獲得コイン 🪙 '+runCoins+'</p>'+(!revived?'<button id="revive" class="gold">▶ 動画を見て復活！</button><br>':'')+'<button id="retry">リトライ</button><button id="home" class="gray">ホームに戻る</button><p><small>広告未接続：復活は試験用に無料</small></p>');if(!revived)document.getElementById("revive").onclick=revive;document.getElementById("retry").onclick=()=>{retries++;start(false)};document.getElementById("home").onclick=home}
function revive(){revived=true;objects=objects.filter(o=>o.x>playerX+120);state="countdown";overlay.style.display="none";count.style.display="grid";let n=3;count.textContent=n;const id=setInterval(()=>{n--;if(n>0)count.textContent=n;else{clearInterval(id);count.style.display="none";start(true)}},1000)}
function jump(){if(state!=="play"||boost>0)return;if(jumps<2){vy=-Math.max(290,H*.92);jumps++}}
canvas.addEventListener("pointerdown",jump);addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});
function frame(t){if(state!=="play")return;const dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;elapsed+=dt;const speed=Math.min(450,160+Math.floor(elapsed/30)*25),travel=speed*(boost>0?3:1)*dt;distance+=travel/25;invuln=Math.max(0,invuln-dt);boost=Math.max(0,boost-dt);if(elapsed>=nextBoost){boost=5;nextBoost=elapsed+45+Math.random()*15}
vy+=Math.max(760,H*2.5)*dt;y+=vy*dt;if(y>=ground-38){y=ground-38;vy=0;jumps=0}
spawn-=travel;coinSpawn-=travel;
if(spawn<=0){let hole=Math.random()<.23;objects.push({x:W+30,w:hole?65:34,hole});spawn=190+Math.random()*160}
if(coinSpawn<=0){let yy=ground-65-(Math.random()<.5?50:0);for(let i=0;i<4;i++)coinItems.push({x:W+50+i*26,y:yy});coinSpawn=220+Math.random()*140}
for(const o of objects){o.x-=travel;if(o.x<playerX+16&&o.x+o.w>playerX-16&&invuln<=0&&boost<=0){if(o.hole?y+38>=ground-3:y+38>ground-34){end();return}}}objects=objects.filter(o=>o.x+o.w>-10);
for(const a of coinItems){a.x-=travel;if(Math.hypot(a.x-playerX,a.y-(y+17))<32||(boost>0&&a.x<playerX+W*.5)){a.got=true;runCoins++}}coinItems=coinItems.filter(a=>!a.got&&a.x>-15);
document.getElementById("score").textContent=score().toLocaleString();document.getElementById("coins").textContent="🪙 "+runCoins;draw(t);requestAnimationFrame(frame)}
function draw(t){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,ground);grad.addColorStop(0,"#7bd2ff");grad.addColorStop(1,"#e4f7ff");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){const x=((i*180-distance*3)%(W+200)+W+200)%(W+200)-100;ctx.fillStyle="#b4e4cb";ctx.beginPath();ctx.arc(x,ground+15,75,Math.PI,0);ctx.fill()}ctx.fillStyle="#79c76d";ctx.fillRect(0,ground,W,H-ground-40);ctx.fillStyle="#a47a50";ctx.fillRect(0,ground+15,W,H-ground-55);
for(const o of objects){if(o.hole){ctx.fillStyle="#203347";ctx.fillRect(o.x,ground,o.w,H-ground-40)}else{ctx.fillStyle="#ad783d";ctx.fillRect(o.x,ground-34,o.w,34);ctx.strokeStyle="#65421e";ctx.lineWidth=3;ctx.strokeRect(o.x+2,ground-32,o.w-4,30)}}
for(const a of coinItems){ctx.fillStyle="#ffcf33";ctx.beginPath();ctx.arc(a.x,a.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff4ad";ctx.lineWidth=2;ctx.stroke()}
ctx.save();if(invuln>0&&Math.floor(t/120)%2===0)ctx.globalAlpha=.45;if(boost>0){ctx.shadowColor="#ed43ff";ctx.shadowBlur=28;ctx.fillStyle="#ffed78";ctx.beginPath();ctx.arc(playerX,y+18,33,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}ctx.font="38px serif";ctx.textAlign="center";ctx.fillText("👶",playerX,y+36);ctx.restore();if(boost>0){ctx.fillStyle="#eb35bd";ctx.font="bold 20px system-ui";ctx.textAlign="center";ctx.fillText("🌈 HYPER BOOST!",W/2,75)}}
home();
})();
</script></body></html>
