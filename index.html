<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ベイビーラン v0.5 ブロック着地対応</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10283d;font-family:system-ui,sans-serif;color:white;overflow:hidden}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#hud{position:fixed;top:5px;width:100%;display:none;align-items:center;justify-content:space-between;padding:0 14px;pointer-events:none;font-weight:900;text-shadow:1px 2px #123}#hudRight{display:flex;align-items:center;gap:10px}#pause{pointer-events:auto;border:2px solid #fff9;border-radius:50%;background:#183f64;color:white;font-size:20px;width:46px;height:46px;padding:0;margin:0}#banner{max-width:320px;left:0;right:auto;border-top-right-radius:12px}#score{font-size:clamp(20px,4vw,34px)}#banner{position:fixed;bottom:0;height:40px;background:#273d4d;width:100%;display:grid;place-items:center;font-size:12px;color:#b8cad2}#overlay{position:fixed;inset:0 0 40px;background:#10283dcf;display:grid;place-items:center}#panel{background:#fff;color:#17304b;border-radius:20px;padding:20px;min-width:min(330px,88vw);max-height:90%;overflow:auto;text-align:center}button{border:0;border-radius:12px;padding:12px 18px;background:#47c7e9;color:#123;font-size:16px;font-weight:800;margin:4px}button.gold{background:#ffc948}button.gray{background:#dbe4e9}#count{position:fixed;inset:0 0 40px;display:none;place-items:center;font-size:90px;font-weight:900;pointer-events:none}#bar{height:15px;border-radius:10px;background:#dbe4e9;overflow:hidden}#fill{height:100%;background:#ffc948}</style></head>
<body><canvas id="game"></canvas><div id="hud"><span>👶</span><span id="score">0</span><span id="hudRight"><span id="coins">🪙 0</span><button id="pause" aria-label="一時停止">Ⅱ</button></span></div><div id="banner">広告予定エリア（試作版は広告未接続）</div><div id="count"></div><div id="overlay"><div id="panel"></div></div>
<script>
(()=>{
"use strict";
const pauseButton=document.getElementById("pause");const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),hud=document.getElementById("hud"),overlay=document.getElementById("overlay"),panel=document.getElementById("panel"),count=document.getElementById("count");
let W=0,H=0,ground=0,playerX=0,y=0,vy=0,jumps=0,supported=false,flipTime=0,flipDuration=.85,flipActive=false,state="home",last=0,elapsed=0,distance=0,runCoins=0,objects=[],coinItems=[],spawn=0,coinSpawn=0,boost=0,nextBoost=50,invuln=0,revived=false,retries=0;
let bank=Number(localStorage.getItem("baby_bank")||0),up=Number(localStorage.getItem("baby_up")||0),best=Number(localStorage.getItem("baby_best")||0);
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0);ground=H-40-Math.max(38,H*.16);playerX=W*.30;if(state!=="play")y=ground-38}addEventListener("resize",resize);resize();
const score=()=>Math.floor(distance*5*(1+up*.01)+runCoins*10);
const cost=()=>Math.round(10*Math.pow(1.18,up)/5)*5;
function view(s){overlay.style.display="grid";panel.innerHTML=s}
function home(){state="home";count.style.display="none";hud.style.display="none";view('<h1>👶 ベイビーラン</h1><p>ベスト '+best.toLocaleString()+' 点</p><p>🪙 '+bank+' コイン</p><button id="start">スタート</button><p><button id="grow" class="gray">育成</button><button id="settings" class="gray">設定</button></p><small>横向き推奨。タップでジャンプ、もう一度タップで二段ジャンプ</small>');document.getElementById("start").onclick=()=>start(false);document.getElementById("grow").onclick=grow;document.getElementById("settings").onclick=()=>{view('<h2>設定</h2><p>操作：タップで二段ジャンプ</p><p>音・振動は今後実装</p><button id="back">戻る</button>');document.getElementById("back").onclick=home}}
function grow(){state="grow";view('<h2>育成 Lv.'+(1+Math.floor(up/10))+'</h2><p>🪙 '+bank+' コイン</p><div id="bar"><div id="fill" style="width:'+(up%10*10)+'%"></div></div><p>次の強化：'+cost()+' コイン</p><button id="upgrade" class="gold">強化する</button><button id="back" class="gray">戻る</button>');document.getElementById("upgrade").onclick=()=>{if(bank>=cost()){bank-=cost();up++;localStorage.setItem("baby_bank",bank);localStorage.setItem("baby_up",up);grow()}};document.getElementById("back").onclick=home}
function start(resume){if(!resume){elapsed=0;distance=0;runCoins=0;objects=[];coinItems=[];spawn=70;coinSpawn=70;boost=0;nextBoost=50;revived=false}y=ground-38;vy=0;jumps=0;flipTime=0;flipActive=false;supported=true;invuln=resume?2:0;state="play";hud.style.display="flex";overlay.style.display="none";last=performance.now();requestAnimationFrame(frame)}
function end(){state="over";bank+=runCoins;localStorage.setItem("baby_bank",bank);const s=score(),record=s>best;if(record){best=s;localStorage.setItem("baby_best",best)}view('<h1>GAME OVER</h1>'+(record?'<h3 style="color:#d9a300">✨ NEW RECORD!</h3>':'')+'<p>スコア '+s.toLocaleString()+'</p><p>獲得コイン 🪙 '+runCoins+'</p>'+(!revived?'<button id="revive" class="gold">▶ 動画を見て復活！</button><br>':'')+'<button id="retry">リトライ</button><button id="home" class="gray">ホームに戻る</button><p><small>広告未接続：復活は試験用に無料</small></p>');if(!revived)document.getElementById("revive").onclick=revive;document.getElementById("retry").onclick=()=>{retries++;start(false)};document.getElementById("home").onclick=home}
function revive(){revived=true;objects=objects.filter(o=>o.x>playerX+120);state="countdown";overlay.style.display="none";count.style.display="grid";let n=3;count.textContent=n;const id=setInterval(()=>{n--;if(n>0)count.textContent=n;else{clearInterval(id);count.style.display="none";start(true)}},1000)}
function pause(){if(state!=="play")return;state="paused";view('<h2>一時停止</h2><p>ゲーム内の時間と障害物は停止中</p><button id="resume">▶ つづける</button><button id="home" class="gray">ホームへ</button>');document.getElementById("resume").onclick=resume;document.getElementById("home").onclick=home}
function resume(){if(state!=="paused")return;state="pauseCountdown";overlay.style.display="none";count.style.display="grid";let n=3;count.textContent=n;const id=setInterval(()=>{if(state!=="pauseCountdown"){clearInterval(id);count.style.display="none";return}n--;if(n>0)count.textContent=n;else{clearInterval(id);count.style.display="none";state="play";last=performance.now();requestAnimationFrame(frame)}},1000)}
pauseButton.addEventListener("pointerdown",e=>e.stopPropagation());pauseButton.addEventListener("click",pause);
function jump(){if(state!=="play"||boost>0)return;if(jumps<2){const impulse=Math.max(290,H*.92);vy=-impulse;jumps++;if(jumps===2){flipTime=0;flipDuration=Math.max(.65,2*impulse/Math.max(760,H*2.5));flipActive=true}supported=false}}
canvas.addEventListener("pointerdown",jump);addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump()}});
function frame(t){if(state!=="play")return;const dt=Math.min(.04,Math.max(0,(t-last)/1000));last=t;elapsed+=dt;if(flipActive)flipTime+=dt;const speed=Math.min(450,160+Math.floor(elapsed/30)*25),travel=speed*(boost>0?3:1)*dt;distance+=travel/25;invuln=Math.max(0,invuln-dt);boost=Math.max(0,boost-dt);if(elapsed>=nextBoost){boost=5;nextBoost=elapsed+45+Math.random()*15}
const oldFeet=y+38;const wasSupported=supported;vy+=Math.max(760,H*2.5)*dt;y+=vy*dt;supported=false;let surface=ground;for(const o of objects){if(!o.hole&&o.x<playerX+13&&o.x+o.w>playerX-13){const top=ground-34;if(oldFeet<=top+6&&vy>=0&&top<surface)surface=top}}if(y+38>=surface&&vy>=0){y=surface-38;vy=0;jumps=0;flipActive=false;flipTime=0;supported=true}if(wasSupported&&!supported&&vy===0){vy=1}
spawn-=travel;coinSpawn-=travel;
if(spawn<=0){let hole=Math.random()<.23;objects.push({x:W+30,w:hole?65:34,hole});spawn=190+Math.random()*160}
if(coinSpawn<=0){let yy=ground-65-(Math.random()<.5?50:0);for(let i=0;i<4;i++)coinItems.push({x:W+50+i*26,y:yy});coinSpawn=220+Math.random()*140}
for(const o of objects){o.x-=travel;if(o.x<playerX+16&&o.x+o.w>playerX-16&&invuln<=0&&boost<=0){if(o.hole?y+38>=ground-3:(y+38>ground-32&&oldFeet>ground-34&&y+8<ground)){end();return}}}objects=objects.filter(o=>o.x+o.w>-10);
for(const a of coinItems){a.x-=travel;if(Math.hypot(a.x-playerX,a.y-(y+17))<32||(boost>0&&a.x<playerX+W*.5)){a.got=true;runCoins++}}coinItems=coinItems.filter(a=>!a.got&&a.x>-15);
document.getElementById("score").textContent=score().toLocaleString();document.getElementById("coins").textContent="🪙 "+runCoins;draw(t);requestAnimationFrame(frame)}

function drawBaby(g,x,top,t){
 const airborne=jumps>0&&top<ground-40;
 const phase=t*.018;
 const headTurn=Math.sin(t*.006)*.17;
 const spin=flipActive?Math.min(1,flipTime/flipDuration)*Math.PI*2:0;
 g.save();g.translate(x,top+24);g.rotate(spin);
 const stride=airborne?0:Math.sin(phase);
 const bounce=airborne?0:Math.abs(stride)*1.7;
 g.translate(0,-bounce);
 g.lineJoin="round";g.lineCap="round";g.lineWidth=1.8;g.strokeStyle="#74422f";
 const oval=(cx,cy,rx,ry,color)=>{g.fillStyle=color;g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);g.fill();g.stroke()};
 // rear-stretched arms
 g.save();g.rotate(-.05);oval(-18,-5,14,4.5,"#ffcfaa");oval(-28,-4,5,4.5,"#ffcfaa");g.restore();
 // feet and legs
 for(let i=0;i<2;i++){const v=i===0?1:-1;g.save();g.translate(i?3:-6,17);g.rotate(airborne?(i?.7:-.8):stride*.65*v);oval(0,8,5,12,"#ffd74a");oval(4,17,10,5,"#f85f84");g.restore()}
 // cherry shirt
 oval(-1,5,16,15,"#ffc4d0");
 for(const [dx,dy] of [[-9,2],[3,0],[9,11],[-5,13]]){g.fillStyle="#e74855";g.beginPath();g.arc(dx,dy,2.2,0,7);g.arc(dx+4,dy+1,2.2,0,7);g.fill();g.strokeStyle="#438f58";g.lineWidth=1;g.beginPath();g.moveTo(dx+2,dy-1);g.lineTo(dx+2,dy-5);g.stroke()}
 // neck + hair
 oval(5,-13,5,6,"#ffcfaa");
 g.save();g.translate(6,-22);g.rotate(headTurn);
 oval(0,-3,18,18,"#6d3f2c");
 oval(3,0,16,15,"#ffdab8");
 // fringe
 g.fillStyle="#6d3f2c";g.beginPath();g.moveTo(-13,-7);g.quadraticCurveTo(-12,-23,4,-18);g.quadraticCurveTo(19,-20,17,-8);g.quadraticCurveTo(6,-15,0,-9);g.quadraticCurveTo(-7,-15,-13,-7);g.fill();
 oval(-11,3,3,4,"#ffb99c");
 // big squinty smiling eyes
 g.strokeStyle="#493025";g.lineWidth=2;for(const ex of [-3,10]){g.beginPath();g.arc(ex,-1,3.2,Math.PI*1.05,Math.PI*1.95);g.stroke()}
 // cheeks and wide smile
 g.fillStyle="#f6a7a1";g.globalAlpha=.65;g.beginPath();g.ellipse(-7,5,4,2,0,0,7);g.ellipse(14,5,4,2,0,0,7);g.fill();g.globalAlpha=1;
 g.fillStyle="#b73f45";g.beginPath();g.ellipse(4,7,7,5,0,0,Math.PI);g.fill();g.strokeStyle="#783b36";g.lineWidth=1.2;g.stroke();
 g.restore();g.restore();
}

function draw(t){ctx.clearRect(0,0,W,H);const grad=ctx.createLinearGradient(0,0,0,ground);grad.addColorStop(0,"#7bd2ff");grad.addColorStop(1,"#e4f7ff");ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);for(let i=0;i<8;i++){const x=((i*180-distance*3)%(W+200)+W+200)%(W+200)-100;ctx.fillStyle="#b4e4cb";ctx.beginPath();ctx.arc(x,ground+15,75,Math.PI,0);ctx.fill()}ctx.fillStyle="#79c76d";ctx.fillRect(0,ground,W,H-ground-40);ctx.fillStyle="#a47a50";ctx.fillRect(0,ground+15,W,H-ground-55);
for(const o of objects){if(o.hole){ctx.fillStyle="#203347";ctx.fillRect(o.x,ground,o.w,H-ground-40)}else{ctx.fillStyle="#ad783d";ctx.fillRect(o.x,ground-34,o.w,34);ctx.strokeStyle="#65421e";ctx.lineWidth=3;ctx.strokeRect(o.x+2,ground-32,o.w-4,30)}}
for(const a of coinItems){ctx.fillStyle="#ffcf33";ctx.beginPath();ctx.arc(a.x,a.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff4ad";ctx.lineWidth=2;ctx.stroke()}
ctx.save();if(invuln>0&&Math.floor(t/120)%2===0)ctx.globalAlpha=.45;if(boost>0){ctx.shadowColor="#ed43ff";ctx.shadowBlur=28;ctx.fillStyle="#ffed78";ctx.beginPath();ctx.arc(playerX,y+18,33,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}drawBaby(ctx,playerX,y,t);ctx.restore();if(boost>0){ctx.fillStyle="#eb35bd";ctx.font="bold 20px system-ui";ctx.textAlign="center";ctx.fillText("🌈 HYPER BOOST!",W/2,75)}}
home();
})();
</script></body></html>
