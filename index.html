<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ベイビーラン 星の夢｜アイテム調整版</title>
<style>
*{box-sizing:border-box}
:root{--banner:calc(28px + env(safe-area-inset-bottom));color-scheme:light}
body{margin:0;overflow:hidden;overscroll-behavior:none;background:#172942;font-family:system-ui,sans-serif;color:#fff}
canvas{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none}
button{border:0;border-radius:14px;min-height:44px;padding:8px 15px;background:#b83754;color:white;font:750 16px system-ui;cursor:pointer;touch-action:manipulation}
button.secondary{background:#e6edf3;color:#213450}button:disabled{opacity:.56;cursor:default}
#banner{position:fixed;bottom:0;width:100%;height:var(--banner);padding-bottom:env(safe-area-inset-bottom);display:grid;place-items:center;background:#172942;color:#cdd9e7;font-size:11px}
#hud{position:fixed;inset:calc(7px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) auto calc(8px + env(safe-area-inset-left));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;pointer-events:none}
#hud[hidden],#overlay[hidden],#count[hidden],#eyes[hidden],#distance[hidden]{display:none}
.pill{background:#14253ded;border-radius:15px;padding:6px 9px;font-weight:800;white-space:nowrap}
#best{justify-self:start;font-size:12px}#score{font-size:clamp(16px,5vw,30px);text-align:center}
#hudRight{justify-self:end;display:flex;gap:5px;align-items:center;font-size:13px}
#pause{pointer-events:auto;padding:0;width:44px;background:#182a45;font-size:20px}
#distance{position:fixed;bottom:calc(var(--banner) + 8px);right:calc(8px + env(safe-area-inset-right));font-size:12px;pointer-events:none}
#overlay,#count,#eyes{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) var(--banner) env(safe-area-inset-left);display:grid;place-items:center;padding:10px}
#overlay{background:#131d414f}#overlay[data-view=home]{background:none;align-items:end}
#panel{background:#fff6eb;color:#27364a;border:2px solid #fff;border-radius:22px;width:min(380px,100%);max-height:100%;overflow:auto;padding:14px;text-align:center;box-shadow:0 12px 35px #1420335c}
#panel h1,#panel h2{margin:1px 0 6px;line-height:1.16}#panel p{margin:7px 0}#panel small{display:block;margin-top:7px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
#overlay[data-view=home] .row{justify-content:start}#settings{margin-left:auto}
#count{font-size:clamp(45px,14vw,82px);font-weight:950;text-shadow:0 4px 12px #27364a;pointer-events:none}
#eyes{background:#171a352d;pointer-events:none}#eyes div{background:#ffdbbd;color:#633b31;border-radius:40px;padding:2px 28px;font-size:43px;letter-spacing:8px;animation:blink .5s both}
@keyframes blink{0%{transform:scaleY(.15)}48%,100%{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.45);opacity:0}75%{transform:scale(1.05)}}
#overlay[data-view=over] #panel{animation:pop .32s ease-out}
progress{accent-color:#b83754;width:80%}
</style>
</head>
<body>
<canvas id="game" aria-label="ベイビーランの走行画面"></canvas>
<div id="hud" hidden><span id="best" class="pill"></span><span id="score" class="pill">0</span><div id="hudRight"><span id="stars" class="pill"></span><button id="pause" aria-label="一時停止">Ⅱ</button></div></div>
<div id="distance" class="pill" hidden></div>
<div id="banner">広告枠</div>
<div id="count" hidden></div>
<div id="eyes" hidden><div>● ●</div></div>
<div id="overlay" data-view="home"><div id="panel"></div></div>
<script>
"use strict";
const byId = id => document.getElementById(id);
const canvas = byId("game");
const ctx = canvas.getContext("2d");
const overlay = byId("overlay");
const count = byId("count");
const GRAVITY = 1180, IMPULSE = 365, SECOND = 365, BABY_HEIGHT = 55;
const PROFILE = "baby_run_profile_v1";
const wardrobe = [
 {name:"さくら柄（試作）",color:"#ffc4d0"},
 {name:"ミント（仮）",color:"#a4e2c5"},
 {name:"すみれ（仮）",color:"#b9aff0"}
];
const items = {
 bonus:{name:"星 +5",icon:"⭐",tier:"weak",duration:0},
 magnet:{name:"磁石",icon:"🧲",tier:"medium",duration:5000},
 shield:{name:"おしゃぶり",icon:"",tier:"medium",duration:3000},
 bike:{name:"バランスバイク",icon:"🚲",tier:"strong",duration:5000}
};
const itemColors={weak:"#ffec9e",medium:"#b5f2ff",strong:"#e9c1ff"};
const itemOrder=["bonus","magnet","bonus","shield","bonus","bike"];
const BUBBLE_RADIUS=19;
let W, H, ground, playerX, width, height;
let state = "home", stageTime = 0, afterCount, last, audio, warning;
let elapsed, position, runStars, rawScore, y, vy, jumps, supported = true, falling;
let flipActive = false, flipTime = 0, flipDuration = .62, invuln, revived, credited;
let phase, phaseTime, route, nextHouse, safeUntil, nextFeature, itemIndex, power, powerUntil, pickupAfter;
let nextItemAt, itemDelay;
let objects = [], stars = [], pickups = [];

function readProfile(){
 const defaults = {bank:0,up:0,best:0,outfit:0,owned:[0],sound:true,vibration:true};
 try {
  const saved = localStorage.getItem(PROFILE);
  const candidate = saved ? JSON.parse(saved) : {
   bank:Number(localStorage.getItem("baby_bank")),up:Number(localStorage.getItem("baby_up")),best:Number(localStorage.getItem("baby_best"))
  };
  for(const key of ["bank","up","best"]){
   if(Number.isSafeInteger(candidate?.[key]) && candidate[key]>=0) defaults[key]=candidate[key];
  }
  defaults.owned = [0,...[1,2].filter(id=>candidate?.owned?.includes?.(id))];
  if(defaults.owned.includes(candidate?.outfit)) defaults.outfit=candidate.outfit;
  for(const key of ["sound","vibration"]) if(typeof candidate?.[key]==="boolean") defaults[key]=candidate[key];
 } catch {}
 return defaults;
}
const profile = readProfile();
function save(){
 try { localStorage.setItem(PROFILE,JSON.stringify(profile)); }
 catch { byId("banner").textContent="星・記録の保存を利用できません"; }
}
function resize(){
 width=canvas.clientWidth;height=canvas.clientHeight;
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(width*d);canvas.height=Math.round(height*d);
 const scale=Math.min(width/340,height/255);
 W=width/scale;H=height/scale;ground=H-Math.max(46,H*.17);playerX=Math.min(96,W*.26);
 ctx.setTransform(d*scale,0,0,d*scale,0,0);
}
addEventListener("resize",resize);resize();

function sound(freq,duration=.11){
 if(!profile.sound || !audio || audio.state!=="running") return;
 const oscillator=audio.createOscillator(),gain=audio.createGain(), now=audio.currentTime;
 oscillator.frequency.setValueAtTime(freq,now);
 oscillator.frequency.exponentialRampToValueAtTime(freq*1.22,now+duration);
 gain.gain.setValueAtTime(.07,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);
 oscillator.connect(gain).connect(audio.destination);oscillator.start(now);oscillator.stop(now+duration);
}
function unlockSound(){
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!profile.sound || !Audio) return;
 try {audio ??= new Audio();if(audio.state==="suspended") audio.resume().catch(()=>{});} catch {}
}
function buzz(pattern){if(profile.vibration) navigator.vibrate?.(pattern);}
function view(name,html){
 overlay.dataset.view=name;
 byId("panel").innerHTML=html;overlay.hidden=false;
}
function button(id,label,cls="",disabled=false){
 return `<button id="${id}" class="${cls}" ${disabled?"disabled":""}>${label}</button>`;
}
function on(id,fn){byId(id).onclick=fn;}
function setHud(show){byId("hud").hidden=byId("distance").hidden=!show;}
const format = n => n.toLocaleString("ja-JP");
const score = () => Math.floor(rawScore);
function home(){
 state="home";stageTime=0;count.hidden=byId("eyes").hidden=true;setHud(false);
 view("home",`<h1>ベイビーラン</h1><p>BEST ${format(profile.best)}　⭐ ${format(profile.bank)}</p>${button("start","スタート")}
 <small>タップでジャンプ・空中でもう一度タップで前転</small>
 <div class="row">${button("grow","育成","secondary")}${button("closet","衣装","secondary")}${button("settings","設定","secondary")}</div>`);
 on("start",start);on("grow",grow);on("closet",closet);on("settings",settings);
}
function upgradeCost(ticks){
 const level=Math.floor(ticks/10);
 return level<2 ? level+1 : 3+Math.floor(Math.sqrt(level-2)/2);
}
function grow(){
 state="menu";
 const single=upgradeCost(profile.up);
 const total=Array.from({length:10},(_,i)=>upgradeCost(profile.up+i)).reduce((a,b)=>a+b,0);
 view("menu",`<h2>育成 Lv.${1+Math.floor(profile.up/10)}</h2><p>⭐ ${format(profile.bank)}　スコア ×${(1+profile.up*.01).toFixed(2)}</p>
 <progress value="${profile.up%10}" max="10" aria-label="育成の目盛り"></progress><p>${profile.up%10} / 10</p>
 <div class="row">${button("up","星でレベルアップ（"+single+"星）","",profile.bank<single)}
 ${button("up10","10回まとめて育成（"+total+"星）","",profile.bank<total)}${button("back","戻る","secondary")}</div>`);
 function improve(amount,cost){if(profile.bank<cost) return;profile.bank-=cost;profile.up+=amount;save();grow();}
 on("up",()=>improve(1,single));on("up10",()=>improve(10,total));on("back",home);
}
function closet(){
 state="menu";
 view("menu",`<h2>走るときの衣装</h2><p>⭐ ${format(profile.bank)}</p><div class="row">${wardrobe.map((entry,id)=>{
  const owned=profile.owned.includes(id);
  return button("outfit"+id,entry.name+(profile.outfit===id?"・着用中":owned?"・着る":"・3,000星"),"secondary",profile.outfit===id||(!owned&&profile.bank<3000));
 }).join("")}${button("back","戻る")}</div>`);
 wardrobe.forEach((_,id)=>on("outfit"+id,()=>{
  if(!profile.owned.includes(id)){
   if(profile.bank<3000) return;
   profile.bank-=3000;profile.owned.push(id);
  }
  profile.outfit=id;save();closet();
 }));
 on("back",home);
}
function settings(){
 state="menu";
 view("menu",`<h2>設定</h2><div class="row">${button("sound","効果音 "+(profile.sound?"ON":"OFF"))}
 ${button("vibration","振動 "+(profile.vibration?"ON":"OFF"))}${button("back","戻る","secondary")}</div>
 <small>振動は端末・ブラウザが対応している場合に作動します。</small>`);
 on("sound",()=>{profile.sound=!profile.sound;unlockSound();save();settings();});
 on("vibration",()=>{profile.vibration=!profile.vibration;buzz(25);save();settings();});on("back",home);
}
function start(){
 unlockSound();sound(440,.28);
 elapsed=position=runStars=rawScore=credited=invuln=0;
 phase="forest";phaseTime=0;route="day";nextHouse=60;safeUntil=0;
 nextFeature=280;itemDelay=4500;nextItemAt=Infinity;itemIndex=0;
 revived=false;power=null;powerUntil=pickupAfter=0;objects=[];stars=[];pickups=[];
 resetJump();state="sparkle";stageTime=0;overlay.hidden=true;setHud(true);updateHud();
}
function resetJump(){
 y=vy=jumps=flipTime=0;supported=true;falling=flipActive=warning=false;
}
function countdown(then){
 state="count";stageTime=0;afterCount=then;count.textContent="3";count.hidden=false;
}
function enterPlay(now=Date.now()){
 expirePower(now);
 nextItemAt=now+itemDelay;
 state="play";
}
function pause(){
 if(state!=="play") return;
 itemDelay=Math.max(0,nextItemAt-Date.now());
 state="paused";
 view("paused",`<h2>一時停止</h2><div class="row">${button("resume","つづける")}${button("home","ホーム","secondary")}</div>`);
 on("resume",()=>{unlockSound();overlay.hidden=true;countdown(enterPlay);});
 on("home",()=>{settle();home();});
}
function settle(){
 profile.bank+=runStars-credited;credited=runStars;profile.best=Math.max(profile.best,score());save();
}
function end(){
 itemDelay=Math.max(0,nextItemAt-Date.now());
 settle();sound(190,.2);buzz(42);state="eyes";stageTime=0;byId("eyes").hidden=false;updateHud();
}
function result(){
 state="over";byId("eyes").hidden=true;
 view("over",`<h2>ゲームオーバー</h2><p><strong>スコア ${format(score())}</strong>　BEST ${format(profile.best)}</p>
 <p>獲得した星 ⭐ ${runStars}</p><div class="row">
 ${revived?"" : button("ad","広告で復活（未接続）","secondary",true)+button("revive","復活を試す")}
 ${button("retry","もう一回")}${button("home","ホーム","secondary")}</div>`);
 if(!revived) on("revive",revive);
 on("retry",start);on("home",home);
}
function revive(){
 revived=true;overlay.hidden=true;
 countdown(()=>{
  // Keep progress and course positions. During recovery the runner can cross the pit in place.
  resetJump();enterPlay();invuln=2;
 });
}
on("pause",pause);
document.addEventListener("visibilitychange",()=>{if(document.hidden) pause();});
function jump(){
 if(state!=="play" || falling) return;
 expirePower(Date.now());
 if(phase==="fork") selectRoute("night");
 if(power==="bike" || jumps>=2) return;
 unlockSound();
 jumps++;vy=jumps===1?IMPULSE:SECOND;supported=false;sound(jumps===1?430:700);
 if(jumps===2){flipActive=true;flipTime=0;}
}
canvas.addEventListener("pointerdown",e=>{if(e.isPrimary && e.button===0) jump();});
addEventListener("keydown",e=>{
 if(e.repeat || (e.code!=="Space" && e.code!=="ArrowUp") || e.target instanceof HTMLButtonElement) return;
 e.preventDefault();jump();
});

function selectRoute(choice){phase="entry";phaseTime=0;route=choice;}
function clearCourse(){objects=[];stars=[];pickups=[];nextFeature=position+220;}
function safePhase(){return phase!=="forest" && phase!=="room";}
function updateRoute(dt){
 phaseTime+=dt;
 if(phase==="forest" && elapsed>=nextHouse){
  phase="hall";phaseTime=0;clearCourse();
 } else if(phase==="hall" && phaseTime>=1){
  phase="fork";phaseTime=0;
 } else if(phase==="fork" && phaseTime>=2){
  selectRoute("day");
 } else if(phase==="entry" && elapsed>=nextHouse+4){
  phase="room";phaseTime=0;nextFeature=position+Math.max(W-playerX+35,215);
 } else if(phase==="room" && phaseTime>=10){
  phase="window";phaseTime=0;clearCourse();
 } else if(phase==="window" && elapsed>=nextHouse+15){
  phase="forest";phaseTime=0;nextHouse+=60;safeUntil=elapsed+6;clearCourse();
 }
}
function speed(){return phase==="room"?(route==="night"?236:210):222+Math.min(30,Math.floor(elapsed/30)*6);}
function hillHeight(o,x){return Math.sin((x-o.x)/o.w*Math.PI)*o.h;}
function terrainAt(x){
 for(const o of objects){
  if(x<o.x || x>=o.x+o.w) continue;
  if(o.kind==="pit") return -Infinity;
  if(o.kind==="hill") return hillHeight(o,x);
 }
 return 0;
}
function buildFeature(x,v){
 const mild=elapsed<9 || elapsed<safeUntil || (phase==="room" && route==="day");
 const roll=Math.random();
 const night=phase==="room" && route==="night";
 const pit=!mild && roll<(night?.32:.25);
 const large=pit && Math.random()<.05;
 const firstReach=v*2*IMPULSE/GRAVITY;
 const o=pit
  ? {x,kind:"pit",w:Math.round(firstReach*(large?1.20:.47)),h:0,large}
  : roll>.81 ? {x,kind:"hill",w:115,h:21} : {
   x,kind:["blocks","bear","train","box","stump","log","platform"][Math.floor(Math.random()*(phase==="room"?4:7))],
   w:Math.round(36+Math.random()*12),h:mild?24:34
  };
 if(o.kind==="platform") {o.h=44;o.w=60;}
 const tall=!mild && o.kind==="box" && Math.random()<.14;
 if(tall) o.h=66;
 objects.push(o);
 const density=night?2:1;
 const add=(sx,sy)=>stars.push({x:sx,y:sy,value:density});
 if(pit){
  for(let i=0;i<2*density;i++) add(x-46+i*26/(2*density-1),24);
 } else {
  const takeoff=x-(tall?76:50), high=tall||(o.kind!=="hill" && Math.random()<.45);
  for(let i=0;i<5*density;i++){
   const t=.09+i*(high?.72:.49)/(5*density-1);
   const flip=.26;
   const arc=high && t>flip
    ? IMPULSE*flip-GRAVITY*flip*flip/2+SECOND*(t-flip)-GRAVITY*(t-flip)**2/2
    : IMPULSE*t-GRAVITY*t*t/2;
   add(takeoff+v*t,27+arc);
  }
 }
 nextFeature=x+o.w+(large?285:night?215:250)+Math.random()*65;
}
function bubbleHeight(p,now){
 return 75+5*Math.sin((now-p.born)/380);
}
function spawnBubble(now){
 if(now<nextItemAt || now<pickupAfter || power || pickups.length) return;
 // Keep the whole jump arc clear, including after a large pit.
 const lead=Math.min(280,W-playerX+28);
 const x=objects.reduce((min,o)=>Math.max(min,o.x+o.w+155),position+lead);
 pickups.push({x,kind:itemOrder[itemIndex++%itemOrder.length],born:now});
 nextFeature=Math.max(nextFeature,x+155);
 nextItemAt=now+6500;
}
function activate(kind,now,multiplier){
 if(power || now<pickupAfter) return false;
 if(kind==="bonus"){
  runStars+=5;rawScore+=50*multiplier;pickupAfter=now+1200;
 } else {
  power=kind;powerUntil=now+items[kind].duration;
  if(kind==="bike") resetJump();
 }
 buzz([24,50,24]);sound(620,.25);
 return true;
}
function safeDismount(){
 // End beyond every touching hazard, never in an adjacent pit or obstacle.
 let blocked;
 while((blocked=objects.find(o=>o.kind!=="hill" && o.x-13<position && o.x+o.w+13>position))){
  position=blocked.x+blocked.w+15;
 }
 resetJump();y=Math.max(0,terrainAt(position));
}
function expirePower(now){
 if(!power || now<powerUntil) return;
 if(power==="bike" || (power==="shield" && objects.some(o=>
  o.x-10<position && o.x+o.w+10>position && (o.kind==="pit" || o.kind!=="hill" && y<o.h)
 ))) safeDismount();
 power=null;pickupAfter=now+1200;buzz(18);
}
function step(dt,now=Date.now()){
 expirePower(now);
 const night=phase==="room" && route==="night";
 const v=speed(), bike=power==="bike", protectedRun=bike||power==="shield"||invuln>0;
 elapsed+=dt;updateRoute(dt);
 // The last stretch before the house is kept clear even at bike speed.
 const spawning=!safePhase() && (phase==="forest"?elapsed<nextHouse-2.5:phaseTime<8);
 if(spawning) spawnBubble(now);
 if(spawning && nextFeature<position+W-playerX+90){
  if(nextFeature<position+W-playerX+26) nextFeature=position+W-playerX+26;
  buildFeature(nextFeature,v);
 }

 position+=v*(bike?3:1)*dt;
 const multiplier=(1+profile.up*.01)*(night?1.5:1)*(bike?1.1:1);
 rawScore+=v*(bike?3:1)*dt/5*multiplier;
 const terrain=terrainAt(position);
 const big=objects.find(o=>o.large&&o.x-position>0&&o.x-position<Math.min(142,W-playerX-30));
 warning=Boolean(big)&&!bike;
 if(warning&&!big.warned){big.warned=true;buzz(32);sound(285);}
 const previous=y;
 if(flipActive){flipTime+=dt;if(flipTime>=flipDuration) flipActive=false;}
 if(bike){y=Math.max(0,terrain);vy=0;}
 else {
  vy-=GRAVITY*dt;y+=vy*dt;
  let floor=terrain;
  if(protectedRun && terrain===-Infinity) floor=0;
  if(!falling && terrain!==-Infinity){
   for(const o of objects){
    if(o.kind==="pit" || o.kind==="hill" || o.x>=position+10 || o.x+o.w<=position-10) continue;
    if(previous>=o.h-2 && vy<=0) floor=Math.max(floor,o.h);
    else if(!protectedRun && y<o.h-1 && y+BABY_HEIGHT>0){end();return;}
   }
  }
  const followsGround=supported && floor===terrain && floor>=0 && previous<22;
  const landed=previous>=floor-3 && y<=floor;
  if(!falling && Number.isFinite(floor) && vy<=0 && (followsGround || landed)){
   y=floor;vy=0;supported=true;jumps=0;flipActive=false;
  } else {
   supported=false;
   if(!falling && y<0 && terrain===-Infinity && !protectedRun){falling=true;flipActive=false;buzz(28);sound(235);}
   if(!falling && y<0 && terrain!==-Infinity){falling=true;buzz(28);sound(235);}
  }
 }
 if(falling && y<ground-H-95){end();return;}
 for(const star of stars){
  const dx=star.x-position, close=Math.hypot(dx,star.y-y-27)<23;
  const automatic=(power==="magnet" && Math.abs(dx)<88) || (bike&&Math.abs(dx)<56);
  if(!falling && (close||automatic)){
   star.got=true;runStars+=star.value;rawScore+=star.value*10*multiplier;sound(900,.07);buzz(12);
  }
 }
 if(!power && !falling && !supported && jumps>0){
  const pickup=pickups.find(p=>Math.hypot(p.x-position,bubbleHeight(p,now)-y-32)<BUBBLE_RADIUS+9);
  if(pickup && activate(pickup.kind,now,multiplier)) pickup.got=true;
 }
 invuln=Math.max(0,invuln-dt);
 objects=objects.filter(o=>o.x+o.w>position-playerX-32);
 stars=stars.filter(s=>!s.got&&s.x>position-playerX-25);
 pickups=pickups.filter(p=>!p.got&&p.x>position-BUBBLE_RADIUS-9);
}
function updateHud(){
 byId("best").textContent="BEST "+format(profile.best);
 byId("score").textContent=format(score());
 byId("stars").textContent="⭐ "+runStars;
 byId("distance").textContent=Math.floor(position/25)+" m";
}
function drawBaby(g,x,top,t){
 const airborne=!supported;
 const phase=t*.018;
 const headTurn=Math.sin(t*.006)*.17;
 const spin=flipActive?Math.min(1,flipTime/flipDuration)*Math.PI*2:0;
 g.save();g.translate(x,top+1);g.scale(.80,.80);g.rotate(spin);
 const stride=airborne?0:Math.sin(phase);
 const bounce=airborne?0:Math.abs(stride)*1.7;
 g.translate(0,-bounce);
 g.lineJoin="round";g.lineCap="round";g.lineWidth=1.8;g.strokeStyle="#74422f";
 const oval=(cx,cy,rx,ry,color)=>{g.fillStyle=color;g.beginPath();g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);g.fill();g.stroke()};
 // rear-stretched arms
 g.save();g.rotate(-.05);oval(-18,-5,14,4.5,"#ffcfaa");oval(-28,-4,5,4.5,"#ffcfaa");g.restore();
 // feet and legs
 for(let i=0;i<2;i++){const v=i===0?1:-1;g.save();g.translate(i?3:-6,17);g.rotate(airborne?(i?.7:-.8):stride*.65*v);oval(0,8,5,12,"#ffd74a");oval(4,17,10,5,"#f85f84");g.restore()}
 // cherry shirt
 oval(-1,5,16,15,wardrobe[profile.outfit].color);
 for(const [dx,dy] of [[-9,2],[3,0],[9,11],[-5,13]]){g.fillStyle="#e74855";g.beginPath();g.arc(dx,dy,2.2,0,7);g.arc(dx+4,dy+1,2.2,0,7);g.fill();g.strokeStyle="#438f58";g.lineWidth=1;g.beginPath();g.moveTo(dx+2,dy-1);g.lineTo(dx+2,dy-5);g.stroke()}
 // neck + hair
 oval(5,-13,5,6,"#ffcfaa");
 g.save();g.translate(6,-22);g.rotate(headTurn);
 oval(0,-3,18,18,"#6d3f2c");
 oval(3,0,16,15,"#ffdab8");
 // fringe
 g.fillStyle="#6d3f2c";g.beginPath();g.moveTo(-13,-7);g.quadraticCurveTo(-12,-23,4,-18);g.quadraticCurveTo(19,-20,17,-8);g.quadraticCurveTo(6,-15,0,-9);g.quadraticCurveTo(-7,-15,-13,-7);g.fill();
 oval(-11,3,3,4,"#ffb99c");
 // big squinty smiling eyes
 g.strokeStyle="#493025";g.lineWidth=2;for(const ex of [-3,10]){g.beginPath();g.arc(ex,-1,3.2,Math.PI*1.05,Math.PI*1.95);g.stroke()}
 if (warning) {
  oval(-3,-2,3,4,"#493025");oval(10,-2,3,4,"#493025");
  oval(5,8,4,5,"#b73f45");
  g.restore();g.restore();return;
 }
 // cheeks and wide smile
 g.fillStyle="#f6a7a1";g.globalAlpha=.65;g.beginPath();g.ellipse(-7,5,4,2,0,0,7);g.ellipse(14,5,4,2,0,0,7);g.fill();g.globalAlpha=1;
 g.fillStyle="#b73f45";g.beginPath();g.ellipse(4,7,7,5,0,0,Math.PI);g.fill();g.strokeStyle="#783b36";g.lineWidth=1.2;g.stroke();
 g.restore();g.restore();
}

function rect(x,y,w,h,fill,r=0){
 ctx.fillStyle=fill;
 if(r){ctx.beginPath();if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);ctx.fill();}
 else ctx.fillRect(x,y,w,h);
}
function oval(x,y,rx,ry,fill){
 ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}
function label(value,x,y,size=18,color="#fff"){
 ctx.font="800 "+size+"px system-ui";ctx.textAlign="center";ctx.fillStyle=color;ctx.fillText(value,x,y);
}
function drawStar(x,y,r,t){
 ctx.fillStyle="#ffd34f";ctx.strokeStyle="#fff3b6";ctx.lineWidth=1.5;
 ctx.beginPath();
 for(let i=0;i<10;i++){
  const a=-Math.PI/2+i*Math.PI/5+t,radius=i%2?r*.48:r;
  const xx=x+Math.cos(a)*radius,yy=y+Math.sin(a)*radius;
  if(i) ctx.lineTo(xx,yy);else ctx.moveTo(xx,yy);
 }
 ctx.closePath();ctx.fill();ctx.stroke();
}
function gradient(top,bottom){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bottom);return g;
}
function bedroom(t){
 rect(0,0,W,H,gradient("#202249","#855476"));
 const x=W/2,y=H*.35;
 rect(x-109,y-66,218,70,"#ca9ab1",10);
 rect(x-103,y-60,206,55,"#523d72",9);
 const breath=1+Math.sin(t*2.6)*.055;
 oval(x+27,y-33,66,24*breath,"#d493bd");oval(x-42,y-30,43,22,"#f8dfea");
 ctx.save();ctx.translate(x-47,y-32);ctx.rotate(Math.max(0,Math.sin(t*.65))**10*.2);
 oval(0,-5,23,20,"#694034");oval(3,-1,19,16,"#ffd7b7");
 ctx.strokeStyle="#683b45";ctx.lineWidth=1.7;
 for(const eye of [-5,7]){ctx.beginPath();ctx.arc(eye,-2,3,.12,Math.PI-.12);ctx.stroke();}
 ctx.beginPath();ctx.arc(2,6,Math.sin(t*.65)>.8?4:2,.12,Math.PI-.12);ctx.stroke();ctx.restore();
 for(let i=0;i<8;i++) drawStar(W*.13+i*W*.105,H*.08+Math.sin(i*4)*15,2+i%3,t*.12);
}
function forest(){
 rect(0,0,W,H,gradient("#71cbea","#f6f7c2"));
 oval(W*.78,H*.18,19,19,"#fff6b1");
 for(let i=0;i<Math.ceil(W/93)+2;i++){
  const x=i*93-(position*.12)%93;
  oval(x,ground-47,70,44,"#b5dd9e");
  rect(x-4,ground-78,9,84,"#826341",3);
  oval(x,ground-90,37,30,"#589961");oval(x-7,ground-102,24,23,"#82bc6a");
 }
 rect(0,ground,W,H-ground,"#a06b4c");rect(0,ground,W,7,"#6cae47");
}
function interior(){
 const night=route==="night" && (phase==="entry"||phase==="room"||phase==="window");
 const hall=phase==="hall"||phase==="fork";
 rect(0,0,W,H,night?gradient("#252a59","#76659a"):gradient("#ffd7a4","#fff1ce"));
 rect(0,ground,W,H-ground,night?"#504266":"#ad715e");
 rect(0,ground,W,7,night?"#c4a1ed":"#f0b27b");
 const wx=W*.74,wy=ground*.37;
 rect(wx-41,wy-37,82,74,night?"#c1acd5":"#aa6b55",8);
 rect(wx-35,wy-31,70,62,night?"#31476c":"#82d8ef",4);
 if(night){oval(wx+12,wy-12,9,9,"#fff1bc");drawStar(wx-16,wy+11,5,0);}
 else{oval(wx+13,wy-11,12,12,"#fff9bd");oval(wx-8,wy+21,27,9,"#96c881");}
 rect(wx-2,wy-35,4,70,night?"#c1acd5":"#aa6b55");
 if(hall){
  const sx=W*.52;
  for(let i=0;i<5;i++) rect(sx+i*15,ground-18-i*12,19,18+i*12,"#c48464",2);
 }
 if(safePhase()){
  const lines={
   hall:["もうすぐ おうち","ここから安全区間"],
   fork:["ジャンプ → 夜の部屋","そのまま → 昼の部屋"],
   entry:[night?"夜の子供部屋":"昼の子供部屋",night?"星の価値 ×2 ／ スコア ×1.5":""],
   window:["窓から 森へ",""]
  }[phase];
  const signY=Math.min(ground-77,Math.max(61,ground*.29));
  rect(W/2-128,signY-22,256,53,night?"#242748e8":"#704c53ee",12);
  label(lines[0],W/2,signY,17);label(lines[1],W/2,signY+20,13);
 }
}
function feature(o){
 const x=playerX+o.x-position, top=ground-o.h;
 if(o.kind==="pit"){
  rect(x,ground,o.w,H-ground,"#251e37");rect(x+4,ground+16,Math.max(0,o.w-8),H-ground-16,"#171628");
  return;
 }
 if(o.kind==="hill"){
  ctx.beginPath();ctx.moveTo(x,ground);
  for(let dx=0;dx<=o.w;dx+=2) ctx.lineTo(x+dx,ground-hillHeight(o,o.x+dx));
  ctx.closePath();ctx.fillStyle="#75af53";ctx.fill();
  ctx.beginPath();
  for(let dx=0;dx<=o.w;dx+=1){
   const top=ground-hillHeight(o,o.x+dx);
   if(dx) ctx.lineTo(x+dx,top);else ctx.moveTo(x,top);
  }
  ctx.strokeStyle="#3d7239";ctx.lineWidth=2;ctx.stroke();return;
 }
 switch(o.kind){
  case "bear":
   oval(x+o.w*.5,ground-8,o.w*.35,8,"#bb8253");
   oval(x+o.w*.5,top+o.h*.44,o.w*.31,o.h*.38,"#d9a673");
   oval(x+o.w*.28,top+4,5,5,"#bb8253");oval(x+o.w*.72,top+4,5,5,"#bb8253");
   oval(x+o.w*.44,top+o.h*.35,2,2,"#50372e");oval(x+o.w*.59,top+o.h*.35,2,2,"#50372e");break;
  case "train":
   rect(x,ground-17,o.w,12,"#34a1a0",4);rect(x+4,top,o.w*.43,o.h-5,"#e57862",4);
   oval(x+11,ground-5,5,5,"#454259");oval(x+o.w-9,ground-5,5,5,"#454259");break;
  case "stump":case "log":
   rect(x,top+3,o.w,o.h-3,"#8f5e43",6);oval(x+o.w/2,top+5,o.w*.5,5,"#c28b63");break;
  default:
   rect(x,top,o.w,o.h,o.kind==="platform"?"#9a63bd":o.kind==="box"?"#dd8860":"#ef796f",6);
   rect(x+4,top+4,o.w-8,4,"#ffffff70",2);
   drawStar(x+o.w/2,top+o.h*.57,6,0);
 }
}
function draw(t,now){
 ctx.clearRect(0,0,W,H);
 if(state==="home"||state==="menu"||state==="sparkle"){
  bedroom(t);
  if(state==="sparkle") for(let i=0;i<26;i++){
   drawStar((i*91+stageTime*59)%W,(i*57+stageTime*77)%H,3+stageTime*3+i%4,t);
  }
  return;
 }
 if(phase==="forest") forest();else interior();
 if(phase==="entry"){
  const fade=Math.max(0,.8-phaseTime)*.75;
  rect(0,0,W,H,`rgba(33,28,64,${fade})`);
 } else if(phase==="window"){
  ctx.save();ctx.globalAlpha=Math.min(1,phaseTime);
  ctx.beginPath();ctx.arc(W*.74,ground*.37,Math.min(1,phaseTime)*Math.hypot(W,H),0,Math.PI*2);ctx.clip();
  forest();label("森へ",W/2,Math.max(72,H*.23),23,"#24463a");ctx.restore();
 }
 for(const o of objects) feature(o);
 for(const star of stars) drawStar(playerX+star.x-position,ground-star.y,star.value>1?8:7,t*.4);
 for(const p of pickups){
  const x=playerX+p.x-position, cy=ground-bubbleHeight(p,now), item=items[p.kind];
  ctx.beginPath();ctx.arc(x,cy,BUBBLE_RADIUS,0,Math.PI*2);
  ctx.fillStyle="#def9ff55";ctx.fill();ctx.strokeStyle=itemColors[item.tier];ctx.lineWidth=2;ctx.stroke();
  oval(x-8,cy-10,4,2,"#ffffffc0");
  if(p.kind==="shield"){
   oval(x,cy,8,5,"#fb8aaa");
   ctx.beginPath();ctx.arc(x,cy+5,4,0,Math.PI*2);ctx.strokeStyle="#fff3ad";ctx.stroke();
  } else label(item.icon,x,cy+(p.kind==="bonus"?0:6),18,"#513e7a");
  if(p.kind==="bonus") label("+5",x,cy+13,11,"#24334c");
 }
 const visible=state!=="count" || elapsed>0;
 if(visible){
  const progress=state==="entrance"?Math.min(1,stageTime/.62):1;
  const x=-34+(playerX+34)*progress;
  const feet=ground-y-Math.sin(Math.PI*progress)*36;
  ctx.save();
  if(invuln>0 && Math.floor(t*8)%2) ctx.globalAlpha=.58;
  if(power==="bike"){
   oval(x-16,feet-4,7,7,"#363457");oval(x+16,feet-4,7,7,"#363457");rect(x-16,feet-13,32,5,"#de596e",2);
  }
  if(power==="shield"){ctx.strokeStyle="#b8ecff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,feet-28,34,0,Math.PI*2);ctx.stroke();}
  drawBaby(ctx,x,feet-29,state==="play"||state==="entrance"?t*1000:elapsed*1000);
  ctx.restore();
  if(warning) label("！",x,feet-66-Math.sin(t*15)*3,26,"#d62242");
 }
 if(power && state==="play"){
  rect(W/2-87,53,174,25,"#30345c",10);label(items[power].name+" "+Math.ceil(Math.max(0,powerUntil-now)/1000)+"秒",W/2,71,14);
 }
}
function frame(now){
 const dt=Math.min(.04,(now-(last??now))/1000);last=now;
 const wallNow=Date.now();
 if(!document.hidden){
  if(state==="paused" || state==="count") expirePower(wallNow);
  stageTime+=dt;
  if(state==="sparkle"&&stageTime>=2) countdown(()=>{state="entrance";stageTime=0;});
  else if(state==="count"){
   count.textContent=String(Math.max(1,3-Math.floor(stageTime)));
   if(stageTime>=3){count.hidden=true;afterCount();}
  } else if(state==="entrance"&&stageTime>=.62) enterPlay(wallNow);
  else if(state==="eyes"&&stageTime>=.5) result();
  if(state==="play"){
   // Fixed-size substeps keep contact and pickup reach stable during slow frames.
   const steps=Math.max(1,Math.ceil(dt*120));
   for(let i=0;i<steps&&state==="play";i++) if(dt>0) step(dt/steps,wallNow);
   updateHud();
  }
  draw(now/1000,wallNow);
 }
 requestAnimationFrame(frame);
}
home();requestAnimationFrame(frame);
</script>
